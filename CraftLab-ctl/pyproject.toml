[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "craftlab-ctl"
version = "0.5.2"
description = "Control System CLI and Supervisor Daemon for CraftLab"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DarkBladeDev" }]
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.7.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
craftctl = "craftlab_ctl.cli:main"
craftctld = "craftlab_ctl.daemon:main"

[project.entry-points."craftlab_ctl.plugins"]
lifecycle = "craftlab_ctl.plugins.lifecycle:LifecyclePlugin"
core = "craftlab_ctl.plugins.core:CorePlugin"
update = "craftlab_ctl.plugins.update:UpdatePlugin"

[tool.setuptools.packages.find]
where = ["src"]
