name: McpAgent
version: 0.5.1
main: com.mcp.agent.core.McpAgentPlugin
api-version: '1.21'
author: MinecraftContentPlatform
description: Remote Agent for Minecraft Content Platform
softdepend: [Oraxen]
commands:
  mcp:
    description: Main command for Minecraft Content Platform Agent
    permission: mcp.admin
    usage: /mcp [give|status|reload]
permissions:
  mcp.admin:
    description: Allows administering the MCP agent and giving deployed items
    default: op
