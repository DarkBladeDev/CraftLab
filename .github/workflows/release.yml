name: Release CraftLab

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            if [[ ! "$TAG" =~ ^v ]]; then
              TAG="v$TAG"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "release_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved Tag: ${TAG} (Version: ${VERSION})"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Web Studio Frontend (CraftLab-frontend)
        run: |
          cd CraftLab-frontend
          npm ci || npm install
          npm run build
          cd ..

      - name: Build Control Panel Web UI (CraftLab-ctl/web)
        run: |
          cd CraftLab-ctl/web
          npm ci || npm install
          npm run build
          cd ..

      - name: Build Paper Agent JAR (paper-agent)
        run: |
          cd paper-agent
          chmod +x gradlew
          ./gradlew build -x test --no-daemon
          cd ..

      - name: Package CraftLab Core Release Archive
        run: |
          mkdir -p dist/releases
          python scripts/build_release.py \
            --version "${{ steps.version.outputs.release_version }}" \
            --output-dir "dist/releases" \
            --skip-frontend \
            --git-commit "${{ github.sha }}"

      - name: Build CraftLab-ctl Python Wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build CraftLab-ctl --wheel --outdir dist/releases

      - name: Stage Release Assets & Generate Checksums
        run: |
          VERSION="${{ steps.version.outputs.release_version }}"
          AGENT_JAR=$(ls paper-agent/build/libs/paper-agent-*.jar | head -n 1)
          if [ -f "$AGENT_JAR" ]; then
            cp "$AGENT_JAR" "dist/releases/paper-agent-${VERSION}.jar"
          fi

          cd dist/releases
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true
          cd ../..

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: CraftLab ${{ steps.version.outputs.tag_name }}
          files: |
            dist/releases/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
