id: craftlab
name: CraftLab
description: Modern web-based Minecraft content authoring, resource pack pipeline, and fleet release management system for Paper 1.21+.

# Supported platforms
platforms:
  - paper
  - purpur

# Minecraft compatibility
minecraft:
  minimum: "1.21.1"
  supported:
    - "1.21.1"
    - "1.21.2"
    - "1.21.3"
    - "1.21.4"
  tested: "1.21.1"

# Java runtime compatibility
java:
  minimum: 21
  recommended: 21

# Folia compatibility
folia:
  supported: false
  status: unsupported
  notes: "Utiliza el scheduler estándar de Paper Bukkit y conexiones WebSocket concurrentes."

# Plugin dependencies
dependencies:
  - id: packetevents
    name: PacketEvents
    type: required
    url: "https://github.com/retrooper/packetevents"
  - id: oraxen
    name: Oraxen
    type: optional
    url: "https://github.com/oraxen/oraxen"

# External links
links:
  github: "https://github.com/DarkBladeDev/CraftLab"
  releases: "https://github.com/DarkBladeDev/CraftLab/releases"
  issues: "https://github.com/DarkBladeDev/CraftLab/issues"

# Documentation engine metadata
documentation:
  defaultLocale: es
  locales:
    - es
    - en
  repoPath: docs

# Published versions (Version history)
versions:
  # -------------------------------------------------------------
  # CURRENT VERSION (LATEST) -> Always the first entry [0]
  # -------------------------------------------------------------
