    releaseDate: "2026-10-10"
    reference: "v0.8.0"
    downloadUrl: "https://github.com/DarkBladeDev/CraftLab/releases/tag/v0.8.0"
    changelog: "Added Security & Audit category, anomaly detection, active mitigations, and forensic explorer"
    minecraft:
      - "1.21.1"
      - "1.21.x"

  - version: "0.7.0"
